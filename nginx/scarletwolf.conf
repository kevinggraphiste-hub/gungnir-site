# Nginx vhost — scarletwolf.cloud (Plan B canonique apex)
#
# Apex scarletwolf.cloud  →  Gungnir (sert ce repo, clean URLs)
# www.scarletwolf.cloud   →  301 https://scarletwolf.cloud
# site.scarletwolf.cloud  →  301 https://scarletwolf.cloud
#
# ⚠️  Adapter avant de déployer :
#   <ROOT>      = chemin physique du clone gungnir-site sur le VPS
#                 (cf. workflow deploy.yml secret VPS_SITE_PATH)
#   <APEX_CRT>  = chemin du cert TLS apex (Let's Encrypt par défaut)
#   <SUB_CRT>   = chemin du cert TLS sous-domaine site.

# ── HTTP → HTTPS (apex + www) ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name scarletwolf.cloud www.scarletwolf.cloud;
    return 301 https://scarletwolf.cloud$request_uri;
}

# ── www HTTPS → apex ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.scarletwolf.cloud;

    ssl_certificate     /etc/letsencrypt/live/scarletwolf.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scarletwolf.cloud/privkey.pem;

    return 301 https://scarletwolf.cloud$request_uri;
}

# ── Apex HTTPS = Gungnir ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scarletwolf.cloud;

    ssl_certificate     /etc/letsencrypt/live/scarletwolf.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scarletwolf.cloud/privkey.pem;

    root /var/www/gungnir-site;    # <ROOT> — à adapter au chemin réel
    index index.html;

    # Clean URLs : on essaie dans l'ordre
    # 1. fichier exact ($uri)            → /robots.txt, /favicon.ico, /assets/…
    # 2. répertoire + index ($uri/)      → / sert /index.html
    # 3. fichier dans pages/             → /contact sert /pages/contact.html
    # 4. 404
    location / {
        try_files $uri $uri/ /pages/$uri.html =404;
    }

    # 301 anciennes URLs .html → clean
    location ~ ^/pages/(.+)\.html$ {
        return 301 /$1;
    }
    location = /index.html {
        return 301 /;
    }

    # Cache long pour assets statiques (1 semaine, immutable)
    location ~* \.(css|js|webp|jpg|jpeg|png|svg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Headers sécurité minimaux
    autoindex off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
}

# ── Sub-domain site. → 301 apex ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name site.scarletwolf.cloud;
    return 301 https://scarletwolf.cloud$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name site.scarletwolf.cloud;

    ssl_certificate     /etc/letsencrypt/live/site.scarletwolf.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site.scarletwolf.cloud/privkey.pem;

    return 301 https://scarletwolf.cloud$request_uri;
}
