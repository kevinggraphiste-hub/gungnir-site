# Nginx vhost — scarletwolf.cloud (Plan B canonique apex)
#
#   apex scarletwolf.cloud       → Gungnir (root /var/www/gungnir-site, clean URLs)
#   www.scarletwolf.cloud        → 301 vers apex
#   site.scarletwolf.cloud       → 301 vers apex
#
# Paths validés sur srv1294093 le 2026-05-27.

# ── HTTP → HTTPS (apex + www) ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name scarletwolf.cloud www.scarletwolf.cloud;
    return 301 https://scarletwolf.cloud$request_uri;
}

# ── www HTTPS → apex ─────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.scarletwolf.cloud;

    ssl_certificate     /etc/letsencrypt/live/scarletwolf.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scarletwolf.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://scarletwolf.cloud$request_uri;
}

# ── Apex HTTPS = Gungnir ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name scarletwolf.cloud;

    ssl_certificate     /etc/letsencrypt/live/scarletwolf.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scarletwolf.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/gungnir-site;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml application/ld+json;

    # Cache long pour assets statiques
    location ~* \.(css|js|webp|jpg|jpeg|png|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 301 anciennes URLs .html → clean (avant le location / pour précédence)
    location ~ ^/pages/(.+)\.html$ {
        return 301 /$1;
    }
    location = /index.html {
        return 301 /;
    }

    # Clean URLs :
    # 1. fichier exact          → /robots.txt, /sitemap.xml, /favicon.ico, /assets/...
    # 2. répertoire + index     → / sert /index.html
    # 3. fichier dans pages/    → /contact sert /pages/contact.html
    # 4. 404
    location / {
        try_files $uri $uri/ /pages/$uri.html =404;
    }

    # HTML : cache court (1h)
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    autoindex off;

    access_log /var/log/nginx/scarletwolf.cloud.access.log;
    error_log  /var/log/nginx/scarletwolf.cloud.error.log;
}

# ── Sub-domain site. → 301 apex ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name site.scarletwolf.cloud;
    return 301 https://scarletwolf.cloud$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name site.scarletwolf.cloud;

    ssl_certificate     /etc/letsencrypt/live/site.scarletwolf.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site.scarletwolf.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://scarletwolf.cloud$request_uri;
}
